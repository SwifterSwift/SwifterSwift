name: CI

# Runs on every pull request and every merge to main. Every job and every test step has a time limit. Anything slower or
# less predictable, such as Windows, full builds for watchOS and visionOS, the documentation and the newest Xcode, runs
# weekly instead (see weekly.yml).
#
# Main only runs the lint, the format check and the macOS tests, which upload the coverage that Codecov compares pull
# requests against. Branch protection requires each pull request to be up to date and pass this workflow first, so the
# other jobs already ran on the same code.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request cancels its previous run. Runs on main always finish, so every merge reports coverage.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # For the Xcode builds: coverage comes from the macOS job, indexing only helps editors, and compiling each module as a
  # whole is faster than file by file when nothing is cached.
  XCODEBUILD_FLAGS: -enableCodeCoverage NO COMPILER_INDEX_STORE_ENABLE=NO SWIFT_COMPILATION_MODE=wholemodule

jobs:
  # Takes seconds, so the other jobs wait for it, and skip when a pull request doesn't touch code.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request is checked out as a merge commit, whose first parent is the base branch.
      - name: Detect code changes
        id: changes
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(Sources/|Tests/|scripts/|Package\.swift$|\.swift-format$|\.github/workflows/)'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Structure
        run: scripts/check-structure.sh
      - name: Documentation comments
        run: python3 scripts/check-docs.py

  # Runs alongside the other jobs rather than before them, because the Swift container takes about 30 seconds to start.
  format:
    name: Format
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Format
        run: swift format lint --strict --recursive --parallel Package.swift Sources Tests

  macos:
    name: macOS
    needs: lint
    if: needs.lint.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Compiles each added or changed extension on its own for macOS, iOS, tvOS, watchOS (including 32-bit devices),
      # visionOS and Mac Catalyst, with Xcode 26.0, the oldest Xcode that SwifterSwift supports. A manual run checks
      # every file.
      - name: Check that changed extensions compile on their own
        if: github.event_name != 'push'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'Sources/*.swift')
            [ -z "$files" ] || JOBS=3 scripts/check-standalone.sh $files
          else
            JOBS=3 scripts/check-standalone.sh
          fi
      - name: Test
        timeout-minutes: 10
        run: swift test --enable-code-coverage --disable-index-store
      - name: Export coverage
        # Depending on the toolchain, SwiftPM builds one test bundle for the package or one per test target, so
        # include every bundle in the report.
        shell: bash
        run: |
          set -euo pipefail
          bin=$(swift build --show-bin-path)
          objects=()
          for bundle in "$bin"/*.xctest; do
            objects+=(-object "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)")
          done
          xcrun llvm-cov export -format=lcov "${objects[@]}" -instr-profile "$bin/codecov/default.profdata" \
            -ignore-filename-regex '(\.build|Tests)/' > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # UIKit runs natively on the Mac through Mac Catalyst, so this tests every UIKit extension without a simulator.
  catalyst:
    name: Mac Catalyst
    needs: lint
    if: needs.lint.outputs.code == 'true' && github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package \
            -destination "platform=macOS,variant=Mac Catalyst" $XCODEBUILD_FLAGS
      # The results go outside the package, because Xcode reloads the package whenever a file in it changes.
      - name: Test
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building -scheme SwifterSwift-Package \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -enableCodeCoverage NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
      - name: Show test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TestResults.xcresult" \
            | jq -r '.testFailures[] | "\(.testIdentifierString): \(.failureText)"'

  # The simulator jobs build first, then boot the simulator and wait until it has finished booting: tests stall while
  # its system services are still starting, and booting during the build more than doubles the build time.
  ios:
    name: iOS
    needs: lint
    if: needs.lint.outputs.code == 'true' && github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Find the simulator
        run: echo "SIMULATOR=$(scripts/simulator-destination.sh iOS)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "$SIMULATOR" \
            $XCODEBUILD_FLAGS
      - name: Boot the simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "${SIMULATOR#id=}" -b
      - name: Test
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building -scheme SwifterSwift-Package -destination "$SIMULATOR" \
            -enableCodeCoverage NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
      - name: Show test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TestResults.xcresult" \
            | jq -r '.testFailures[] | "\(.testIdentifierString): \(.failureText)"'

  tvos:
    name: tvOS
    needs: lint
    if: needs.lint.outputs.code == 'true' && github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Find the simulator
        run: echo "SIMULATOR=$(scripts/simulator-destination.sh tvOS)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "$SIMULATOR" \
            $XCODEBUILD_FLAGS
      - name: Boot the simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "${SIMULATOR#id=}" -b
      - name: Test
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building -scheme SwifterSwift-Package -destination "$SIMULATOR" \
            -enableCodeCoverage NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
      - name: Show test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/TestResults.xcresult" \
            | jq -r '.testFailures[] | "\(.testIdentifierString): \(.failureText)"'

  # Linux tests, plus Android (built, then tested in an emulator) and WebAssembly (built), through Swift's own
  # reusable workflow. Windows runs weekly. The time limits replace the workflow's defaults of 60 to 90 minutes a step.
  portability:
    name: Portability
    needs: lint
    if: needs.lint.outputs.code == 'true' && github.event_name != 'push'
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.17
    with:
      linux_swift_versions: '["6.4"]'
      linux_build_timeout: 10
      enable_wasm_sdk_build: true
      wasm_sdk_versions: '["6.4"]'
      wasm_sdk_build_command: swift build --build-tests
      wasm_sdk_build_timeout: 10
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      android_sdk_versions: '["6.4"]'
      android_sdk_triples: '["x86_64-unknown-linux-android28"]'
      android_sdk_build_timeout: 10
      enable_windows_checks: false
      enable_macos_checks: false
      enable_ios_checks: false

  # The only check that branch protection requires, so adding, renaming or skipping a job never needs a settings change.
  # Skipped jobs count as passing; a failed or cancelled job fails it.
  passed:
    name: CI passed
    needs: [lint, format, macos, catalyst, ios, tvos, portability]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
