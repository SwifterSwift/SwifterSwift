name: CI

# Runs on every pull request and merge. Every job has a time limit, and anything slower or less predictable, such as
# Windows, full builds for watchOS and visionOS, and the documentation, runs weekly instead (see weekly.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, cheap checks that every pull request runs. The other jobs wait for this one, and skip when a pull request
  # doesn't touch code (GitHub treats a skipped required check as passing).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          code=true
          if [ -n "$BASE" ] && ! git diff --name-only "$BASE" HEAD \
              | grep -qE '^(Sources/|Tests/|scripts/|Package\.swift$|\.swift-format$|\.github/workflows/)'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install Python
        run: command -v python3 || (apt-get update -qq && apt-get install -y -qq python3)
      - name: Format
        run: swift format lint --strict --recursive --parallel Package.swift Sources Tests
      - name: Structure
        run: scripts/check-structure.sh
      - name: Documentation comments
        run: python3 scripts/check-docs.py

  macos:
    name: macOS
    needs: lint
    if: needs.lint.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Compiles each added or changed extension on its own for macOS, iOS, tvOS, watchOS (including 32-bit devices),
      # visionOS and Mac Catalyst. Only a run without a previous commit to compare with checks every file.
      - name: Check that changed extensions compile on their own
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'Sources/*.swift')
            [ -z "$files" ] || JOBS=3 scripts/check-standalone.sh $files
          else
            JOBS=3 scripts/check-standalone.sh
          fi
      - name: Test
        timeout-minutes: 10
        run: swift test --enable-code-coverage
      - name: Export coverage
        # Depending on the toolchain, SwiftPM builds one test bundle for the package or one per test target, so
        # include every bundle in the report.
        shell: bash
        run: |
          set -euo pipefail
          bin=$(swift build --show-bin-path)
          objects=()
          for bundle in "$bin"/*.xctest; do
            objects+=(-object "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)")
          done
          xcrun llvm-cov export -format=lcov "${objects[@]}" -instr-profile "$bin/codecov/default.profdata" \
            -ignore-filename-regex '(\.build|Tests)/' > coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # UIKit runs natively on the Mac through Mac Catalyst, so this tests every UIKit extension without a simulator.
  catalyst:
    name: Mac Catalyst
    needs: lint
    if: needs.lint.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "platform=macOS,variant=Mac Catalyst"
      - name: Test
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building -scheme SwifterSwift-Package -destination "platform=macOS,variant=Mac Catalyst" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 -resultBundlePath TestResults.xcresult
      - name: Show test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult \
            | jq -r '.testFailures[] | "\(.testIdentifierString): \(.failureText)"'

  # The simulator jobs build first, then boot the simulator and wait until it has finished booting: tests stall while
  # its system services are still starting, and booting during the build slows the build down.
  ios:
    name: iOS
    needs: lint
    if: needs.lint.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Find the simulator
        run: echo "SIMULATOR=$(scripts/simulator-destination.sh iOS)" >> "$GITHUB_ENV"
      - name: Build
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "$SIMULATOR"
      - name: Boot the simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "${SIMULATOR#id=}" -b
      - name: Test
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building -scheme SwifterSwift-Package -destination "$SIMULATOR" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 -resultBundlePath TestResults.xcresult
      - name: Show test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult \
            | jq -r '.testFailures[] | "\(.testIdentifierString): \(.failureText)"'

  tvos:
    name: tvOS
    needs: lint
    if: needs.lint.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Find the simulator
        run: echo "SIMULATOR=$(scripts/simulator-destination.sh tvOS)" >> "$GITHUB_ENV"
      - name: Build
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "$SIMULATOR"
      - name: Boot the simulator
        timeout-minutes: 5
        run: xcrun simctl bootstatus "${SIMULATOR#id=}" -b
      - name: Test
        timeout-minutes: 5
        run: |
          xcodebuild test-without-building -scheme SwifterSwift-Package -destination "$SIMULATOR" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 -resultBundlePath TestResults.xcresult
      - name: Show test failures
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult \
            | jq -r '.testFailures[] | "\(.testIdentifierString): \(.failureText)"'

  # Linux tests, plus Android (built, then tested in an emulator) and WebAssembly (built), through Swift's own
  # reusable workflow. Windows runs weekly.
  portability:
    name: Portability
    needs: lint
    if: needs.lint.outputs.code == 'true'
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.17
    with:
      linux_swift_versions: '["6.4"]'
      enable_wasm_sdk_build: true
      wasm_sdk_versions: '["6.4"]'
      wasm_sdk_build_command: swift build --build-tests
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
      android_sdk_versions: '["6.4"]'
      android_sdk_triples: '["x86_64-unknown-linux-android28"]'
      enable_windows_checks: false
      enable_macos_checks: false
      enable_ios_checks: false
