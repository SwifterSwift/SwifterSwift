name: Weekly

# The checks that are too slow to run on every pull request: Windows, full builds for every Apple platform, the
# documentation, and the newest Xcode and Swift nightly toolchains, which catch new Apple APIs that collide with
# SwifterSwift's names and toolchain changes before users hit them.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-platforms:
    name: Apple platforms and documentation
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build for watchOS devices (32-bit)
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination generic/platform=watchOS
      - name: Build for the watchOS simulator
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "generic/platform=watchOS Simulator"
      - name: Build for visionOS
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "generic/platform=visionOS Simulator"
      - name: Build for iOS devices
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination generic/platform=iOS
      - name: Documentation (macOS, including AppKit)
        run: xcodebuild docbuild -quiet -scheme SwifterSwift-Package -destination generic/platform=macOS OTHER_DOCC_FLAGS=--warnings-as-errors
      - name: Documentation (iOS, including UIKit)
        run: xcodebuild docbuild -quiet -scheme SwifterSwift-Package -destination generic/platform=iOS OTHER_DOCC_FLAGS=--warnings-as-errors

  newest-xcode:
    name: Newest Xcode
    # Move this to the next Xcode image (for example `xcode-28`) when its betas become available.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Test on macOS
        timeout-minutes: 15
        run: swift test
      - name: Build for the iOS simulator
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination "generic/platform=iOS Simulator"
      - name: Build for watchOS devices (32-bit)
        run: xcodebuild build-for-testing -quiet -scheme SwifterSwift-Package -destination generic/platform=watchOS

  # Swift's reusable workflow allows each step 60 to 90 minutes unless told otherwise.
  windows:
    name: Windows
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.17
    with:
      enable_linux_checks: false
      windows_swift_versions: '["6.4"]'
      windows_build_timeout: 20
      enable_macos_checks: false
      enable_ios_checks: false

  swift-nightly:
    name: Swift nightly
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.17
    with:
      linux_swift_versions: '["nightly-main"]'
      linux_build_timeout: 20
      enable_windows_checks: false
      enable_macos_checks: false
      enable_ios_checks: false
